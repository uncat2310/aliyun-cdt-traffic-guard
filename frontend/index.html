<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>流量守卫</title>
    <meta name="description" content="阿里云香港服务器流量守卫监控面板" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html { background-color: #09090b; color-scheme: dark; }
      html.light-theme { background-color: #f8fafc; color-scheme: light; }
      body { background-color: inherit; }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('traffic_guard_theme');
          var isLight = t === 'light' || ((!t || t === 'system') && !window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.className = isLight ? 'light-theme' : 'dark-theme';
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="dark-theme">
    <script>
      document.body.className = document.documentElement.classList.contains('light-theme') ? 'light-theme' : 'dark-theme';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
